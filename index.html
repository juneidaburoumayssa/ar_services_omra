<style>
/* ============================================================
   AR SERVICES — DESIGN SYSTEM
   Palette dérivée directement des supports print de la marque :
   vert pétrole profond, ivoire, doré champagne.
   ============================================================ */
:root{
  --petrol-950:#061A18;
  --petrol-900:#08241F;
  --petrol-800:#0B2F2B;
  --petrol-700:#123F39;
  --petrol-600:#1A544C;
  --petrol-500:#276B62;

  --ivory:#F7F2E8;
  --cream:#EDE3D2;
  --cream-deep:#DFD1B8;

  --gold:#C9A66B;
  --gold-soft:#E0C892;
  --gold-deep:#A8873F;

  --ink:#0A1F1D;
  --ink-soft:#3D5350;
  --on-dark:#EDE8DC;
  --on-dark-soft:#B3C3BF;

  --line-dark:rgba(201,166,107,.28);
  --line-light:rgba(18,63,57,.16);

  --font-display:'Jost','Helvetica Neue',Arial,sans-serif;
  --font-body:'Manrope','Helvetica Neue',Arial,sans-serif;

  --r-sm:10px;
  --r-md:16px;
  --r-lg:24px;
  --r-pill:999px;

  --shadow-sm:0 1px 2px rgba(6,26,24,.06);
  --shadow-md:0 10px 30px -18px rgba(6,26,24,.45);
  --shadow-lg:0 24px 60px -32px rgba(6,26,24,.55);

  --wrap:1180px;
  --gutter:clamp(20px,5vw,48px);
  --sec-y:clamp(64px,9vw,116px);

  --ease:cubic-bezier(.22,.61,.36,1);
}
html[dir="rtl"]{
  --font-display:'Noto Kufi Arabic','Jost',sans-serif;
  --font-body:'Noto Kufi Arabic','Manrope',sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font-family:var(--font-body);font-size:16.5px;line-height:1.68;
  font-weight:400;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---- Focus & accessibilité ---- */
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:200;background:var(--petrol-800);color:var(--ivory);padding:12px 20px;border-radius:0 0 var(--r-sm) 0}
.skip:focus{inset-inline-start:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- Layout ---- */
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:var(--sec-y)}
.section--tight{padding-block:clamp(48px,6vw,80px)}
.section--dark{background:var(--petrol-800);color:var(--on-dark)}
.section--deep{background:var(--petrol-900);color:var(--on-dark)}
.section--cream{background:var(--cream)}
.section--dark p,.section--deep p{color:var(--on-dark-soft)}

/* ============================================================
   SIGNATURE — le "cadre pilulé doré" des affiches AR SERVICES :
   un panneau à bordure dorée fine dont le titre s'encastre
   dans la bordure supérieure.
   ============================================================ */
.panel{position:relative;border:1px solid var(--line-dark);border-radius:var(--r-lg);padding:clamp(30px,4vw,44px) clamp(20px,3.4vw,38px) clamp(26px,3.4vw,38px)}
.panel__title{
  position:absolute;top:0;inset-inline-start:50%;transform:translate(-50%,-50%);
  background:var(--petrol-800);border:1px solid var(--line-dark);border-radius:var(--r-pill);
  padding:9px 26px;font-family:var(--font-display);font-size:clamp(.82rem,1.5vw,1rem);
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--ivory);
}
html[dir="rtl"] .panel__title{transform:translate(50%,-50%);letter-spacing:0}
.section--deep .panel__title{background:var(--petrol-900)}
.section--cream .panel,.section--light .panel{border-color:var(--line-light)}
.section--cream .panel__title{background:var(--cream);color:var(--petrol-800);border-color:var(--line-light)}
.panel--light{border-color:var(--line-light)}
.panel--light .panel__title{background:var(--ivory);color:var(--petrol-800);border-color:var(--line-light)}
@media (max-width:560px){
  .panel__title{white-space:normal;text-align:center;width:min(92%,340px);line-height:1.3}
}

/* ---- Eyebrow & divider losange (repris de l'affiche Omra) ---- */
.eyebrow{
  display:flex;align-items:center;gap:12px;font-family:var(--font-display);
  font-size:.74rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold-deep);margin-bottom:18px
}
html[dir="rtl"] .eyebrow{letter-spacing:.06em}
.section--dark .eyebrow,.section--deep .eyebrow{color:var(--gold-soft)}
.eyebrow::before{content:"";width:26px;height:1px;background:currentColor;opacity:.6;flex:none}
.rule{display:flex;align-items:center;gap:14px;margin:26px 0;color:var(--gold)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.5}
.rule span{font-size:.6rem;transform:rotate(45deg);width:7px;height:7px;background:currentColor;display:block}

/* ---- Titres ---- */
.h-xl{font-size:clamp(2.1rem,6.4vw,4.1rem);letter-spacing:-.025em;font-weight:700}
.h-lg{font-size:clamp(1.7rem,3.6vw,2.7rem);letter-spacing:-.02em}
.h-md{font-size:clamp(1.25rem,2.2vw,1.6rem)}
.h-sm{font-size:1.06rem;font-weight:600;letter-spacing:0}
.lead{font-size:clamp(1rem,1.5vw,1.12rem);color:var(--ink-soft);max-width:62ch}
.section--dark .lead,.section--deep .lead{color:var(--on-dark-soft)}
.muted{color:var(--ink-soft);font-size:.93rem}
.section--dark .muted,.section--deep .muted{color:var(--on-dark-soft)}
.gold{color:var(--gold-deep)}
.section--dark .gold,.section--deep .gold,.hero .gold{color:var(--gold-soft)}

/* ---- Boutons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-display);font-weight:500;font-size:.94rem;letter-spacing:.04em;
  padding:14px 26px;border-radius:var(--r-pill);border:1px solid transparent;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease);
  text-align:center;min-height:48px
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn--gold{background:var(--gold);color:var(--petrol-950);border-color:var(--gold)}
.btn--gold:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
.btn--ghost{border-color:var(--line-dark);color:var(--ivory);background:rgba(247,242,232,.04)}
.btn--ghost:hover{border-color:var(--gold);background:rgba(201,166,107,.12)}
.btn--outline{border-color:var(--petrol-700);color:var(--petrol-800);background:transparent}
.btn--outline:hover{background:var(--petrol-800);color:var(--ivory);border-color:var(--petrol-800)}
.btn--solid{background:var(--petrol-800);color:var(--ivory);border-color:var(--petrol-800)}
.btn--solid:hover{background:var(--petrol-700);border-color:var(--petrol-700)}
.btn--sm{padding:10px 18px;font-size:.86rem;min-height:42px}
.btn--full{width:100%}
.btn .ico{flex:none}

.linkarrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:500;color:var(--gold-deep);letter-spacing:.03em;border-bottom:1px solid transparent;transition:.25s var(--ease)}
.linkarrow:hover{border-color:currentColor}
.linkarrow .ico{transition:transform .25s var(--ease)}
.linkarrow:hover .ico{transform:translateX(3px)}
html[dir="rtl"] .linkarrow .ico{transform:scaleX(-1)}
html[dir="rtl"] .linkarrow:hover .ico{transform:scaleX(-1) translateX(3px)}
.section--dark .linkarrow,.section--deep .linkarrow{color:var(--gold-soft)}

/* ---- Icônes ---- */
html[dir="rtl"] .ico--dir{transform:scaleX(-1)}
html[dir="rtl"] .hero__scene,html[dir="rtl"] .figure svg{transform:scaleX(-1)}
html[dir="rtl"] .hero__veil{transform:scaleX(-1)}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico--lg{width:34px;height:34px;stroke-width:1.3}

/* ============================================================
   HEADER
   ============================================================ */
.header{position:fixed;top:0;inset-inline:0;z-index:90;transition:background .4s var(--ease),box-shadow .4s var(--ease),border-color .4s var(--ease);border-bottom:1px solid transparent}
.header::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,26,24,.55),transparent);opacity:1;transition:opacity .4s var(--ease)}
.header.is-stuck{background:rgba(8,36,31,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line-dark)}
.header.is-stuck::before{opacity:0}
.header__inner{position:relative;display:flex;align-items:center;gap:20px;height:82px;transition:height .4s var(--ease)}
.header.is-stuck .header__inner{height:70px}

.header.is-stuck .brandlogo{width:150px;height:57px}
.brandlogo--footer{width:205px;height:78px}
@media (max-width:520px){ .brandlogo{width:142px;height:54px} }

.nav{display:flex;align-items:center;gap:2px;margin-inline-start:auto}
.nav a{
  font-family:var(--font-display);font-size:.87rem;letter-spacing:.03em;color:var(--on-dark);
  padding:9px 13px;border-radius:var(--r-pill);position:relative;transition:color .25s var(--ease),background .25s var(--ease);white-space:nowrap
}
.nav a:hover{color:#fff;background:rgba(247,242,232,.07)}
.nav a[aria-current="page"]{color:var(--gold-soft)}
.header__actions{display:flex;align-items:center;gap:10px;flex:none}

.langsw{display:flex;align-items:center;border:1px solid var(--line-dark);border-radius:var(--r-pill);overflow:hidden;flex:none}
.langsw button{background:none;border:0;padding:8px 13px;font-family:var(--font-display);font-size:.8rem;letter-spacing:.06em;color:var(--on-dark-soft);transition:.25s var(--ease)}
.langsw button[aria-pressed="true"]{background:var(--gold);color:var(--petrol-950)}
.langsw button:not([aria-pressed="true"]):hover{color:#fff}

.burger{display:none;width:46px;height:46px;align-items:center;justify-content:center;border:1px solid var(--line-dark);border-radius:var(--r-pill);background:none;color:var(--ivory)}
.burger .ico{width:20px;height:20px}

@media (max-width:1080px){
  .nav{display:none}
  .burger{display:inline-flex}
  .header__actions{margin-inline-start:auto}
  .header__actions .btn--quote{display:none}
}
@media (max-width:420px){ .langsw{display:none} .logo{padding:6px 14px 6px 12px} }

/* Menu mobile */
.mobilemenu{position:fixed;inset:0;z-index:95;background:var(--petrol-900);display:flex;flex-direction:column;padding:20px var(--gutter) 36px;transform:translateY(-100%);visibility:hidden;transition:transform .45s var(--ease),visibility .45s;overflow-y:auto}
.mobilemenu.is-open{transform:none;visibility:visible}
.mobilemenu__top{display:flex;align-items:center;justify-content:space-between;height:62px;margin-bottom:12px}
.mobilemenu nav{display:flex;flex-direction:column;border-top:1px solid var(--line-dark)}
.mobilemenu nav a{font-family:var(--font-display);font-size:1.12rem;color:var(--on-dark);padding:17px 4px;border-bottom:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:center}
.mobilemenu nav a[aria-current="page"]{color:var(--gold-soft)}
.mobilemenu__cta{display:grid;gap:12px;margin-top:28px}
.mobilemenu__lang{display:flex;justify-content:center;margin-top:26px}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;min-height:min(100svh,860px);display:flex;align-items:flex-end;background:var(--petrol-900);overflow:hidden;padding-block:150px 60px}
.hero__media{position:absolute;inset:0;z-index:0}
.hero__photo{position:absolute;inset:0;background-image:var(--hero-photo,none);background-size:cover;background-position:center 30%;opacity:var(--hero-photo-opacity,1)}
.hero__scene{position:absolute;inset:0;width:100%;height:100%}
.hero__veil{position:absolute;inset:0;background:
  linear-gradient(100deg,rgba(6,26,24,.9) 0%,rgba(6,26,24,.62) 42%,rgba(6,26,24,.2) 72%,rgba(6,26,24,.5) 100%),
  linear-gradient(180deg,rgba(6,26,24,.55) 0%,rgba(6,26,24,0) 34%,rgba(6,26,24,.75) 92%)}
.hero__inner{position:relative;z-index:2;width:100%}
.hero__eyebrow{color:var(--gold-soft)}
.hero h1{color:var(--ivory);max-width:14ch}
.hero h1 span{display:block;color:var(--gold);font-weight:300;font-size:.62em;letter-spacing:.02em;margin-top:.12em}
.hero__slogan{font-family:var(--font-display);font-size:clamp(.92rem,1.9vw,1.16rem);letter-spacing:.16em;text-transform:uppercase;color:var(--ivory);max-width:34ch;margin-top:26px;line-height:1.6}
html[dir="rtl"] .hero__slogan{letter-spacing:0}
.hero__sub{color:var(--on-dark-soft);max-width:52ch;margin-top:16px}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero__trust{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:54px;background:var(--line-dark);border:1px solid var(--line-dark);border-radius:var(--r-md);overflow:hidden}
.hero__trust li{background:rgba(8,36,31,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.hero__trust .ico{color:var(--gold-soft);width:24px;height:24px}
.hero__trust span{font-family:var(--font-display);font-size:.86rem;letter-spacing:.04em;color:var(--ivory);line-height:1.35}
@media (max-width:860px){
  .hero{min-height:auto;padding-block:130px 48px}
  .hero__trust{grid-template-columns:repeat(2,1fr);margin-top:38px}
}
.scrollhint{position:absolute;bottom:26px;inset-inline-end:var(--gutter);z-index:2;display:flex;align-items:center;gap:10px;color:var(--on-dark-soft);font-family:var(--font-display);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:1080px){.scrollhint{display:none}}

.hero__art{
  position:absolute; inset-block:8% 122px; inset-inline-end:5%;
  width:min(36%,500px);
  background:var(--art-image) no-repeat center bottom / contain;
  filter:drop-shadow(0 50px 70px rgba(0,0,0,.6));
  pointer-events:none;
}
html[dir="rtl"] .hero__art{ transform:scaleX(-1) }
@media (max-width:860px){ .hero__art{ width:62%; opacity:.4; inset-inline-end:-4%; inset-block:14% 150px } }
.figure__art{
  position:absolute; inset:6% 6% 54px;
  background:var(--art-image) no-repeat center bottom / contain;
  filter:drop-shadow(0 24px 40px rgba(0,0,0,.5));
}
.figure__art--badal{
  inset:3% 2% 60px;
  background-image:var(--art-badal);
  background-position:center center;
}

/* ============================================================
   PAGE HEADER (pages internes)
   ============================================================ */
.pagehead{background:var(--petrol-900);color:var(--ivory);padding:calc(82px + clamp(48px,7vw,86px)) 0 clamp(48px,7vw,80px);position:relative;overflow:hidden}
.pagehead::after{content:"";position:absolute;inset-inline-end:-8%;top:-40%;width:52%;padding-bottom:52%;border-radius:50%;border:1px solid var(--line-dark);opacity:.5}
.pagehead__inner{position:relative;z-index:1}
.pagehead h1{color:var(--ivory);max-width:18ch}
.pagehead p{margin-top:18px}
.crumbs{display:flex;gap:8px;align-items:center;font-family:var(--font-display);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-soft);margin-bottom:20px;flex-wrap:wrap}
.crumbs a:hover{color:var(--gold-soft)}
.crumbs span{opacity:.5}

/* ============================================================
   CARTES
   ============================================================ */
.grid{display:grid;gap:clamp(16px,2vw,22px)}
.grid--3{grid-template-columns:repeat(3,1fr)}
.grid--2{grid-template-columns:repeat(2,1fr)}
.grid--4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.grid--3,.grid--4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid--2,.grid--3,.grid--4{grid-template-columns:1fr}}

.card{
  background:#fff;border:1px solid var(--line-light);border-radius:var(--r-lg);
  padding:clamp(22px,2.6vw,30px);display:flex;flex-direction:column;gap:14px;
  transition:border-color .35s var(--ease),box-shadow .35s var(--ease),transform .35s var(--ease)
}
.card:hover{border-color:var(--gold);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.section--dark .card,.section--deep .card,.card--dark{background:rgba(247,242,232,.035);border-color:var(--line-dark);color:var(--on-dark)}
.section--dark .card:hover,.section--deep .card:hover{border-color:var(--gold);background:rgba(201,166,107,.07)}
.card__ico{width:56px;height:56px;border-radius:var(--r-pill);border:1px solid var(--line-light);display:grid;place-items:center;color:var(--gold-deep);flex:none}
.section--dark .card__ico,.section--deep .card__ico{border-color:var(--line-dark);color:var(--gold-soft)}
.card h3{font-size:1.14rem;font-weight:600}
.card p{font-size:.94rem;color:var(--ink-soft)}
.section--dark .card p,.section--deep .card p{color:var(--on-dark-soft)}
.card__foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* Prix — toujours visible, jamais caché */
.price{
  display:inline-flex;align-items:baseline;gap:6px;font-family:var(--font-display);
  font-weight:600;font-size:1.4rem;letter-spacing:-.01em;color:var(--petrol-800);
  border:1px solid var(--line-light);border-radius:var(--r-pill);padding:6px 18px;background:var(--ivory);white-space:nowrap
}
.section--dark .price,.section--deep .price{color:var(--gold-soft);border-color:var(--line-dark);background:rgba(201,166,107,.08)}
.price small{font-size:.68rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.section--dark .price small,.section--deep .price small{color:var(--on-dark-soft)}
.price--quote{font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}

/* Liste tarifaire (reprise directe de l'affiche) */
.pricelist{display:flex;flex-direction:column;gap:2px}
.pricelist li{display:flex;align-items:center;gap:clamp(12px,2vw,20px);padding:15px 4px;border-bottom:1px solid var(--line-light)}
.pricelist li:last-child{border-bottom:0}
.section--dark .pricelist li,.section--deep .pricelist li{border-color:var(--line-dark)}
.pricelist .ico{color:var(--gold-deep);flex:none;width:30px;height:30px;stroke-width:1.25}
.section--dark .pricelist .ico,.section--deep .pricelist .ico{color:var(--gold-soft)}
.pricelist__name{font-family:var(--font-display);font-size:clamp(.92rem,1.7vw,1.04rem);letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
html[dir="rtl"] .pricelist__name{letter-spacing:0;text-transform:none}
.pricelist__desc{display:block;font-family:var(--font-body);font-size:.82rem;letter-spacing:0;text-transform:none;color:var(--ink-soft);margin-top:3px}
.section--dark .pricelist__desc,.section--deep .pricelist__desc{color:var(--on-dark-soft)}
.pricelist .price{font-size:1.02rem;padding:5px 14px}
@media (max-width:520px){
  .pricelist li{flex-wrap:wrap}
  .pricelist__name{flex:1 1 100%;order:2}
  .pricelist .price{order:3;margin-inline-start:auto}
  .pricelist .ico{order:1}
}

/* Timeline étapes */
.steps{counter-reset:step;display:grid;gap:0}
.steps li{position:relative;display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,32px);padding-bottom:36px}
.steps li:last-child{padding-bottom:0}
.steps__num{
  position:relative;z-index:1;width:58px;height:58px;border-radius:var(--r-pill);
  border:1px solid var(--line-light);display:grid;place-items:center;background:var(--ivory);
  font-family:var(--font-display);font-weight:500;font-size:1.02rem;letter-spacing:.06em;color:var(--gold-deep)
}
.section--cream .steps__num{background:var(--cream)}
.section--dark .steps__num,.section--deep .steps__num{background:var(--petrol-900);border-color:var(--line-dark);color:var(--gold-soft)}
.steps li::before{content:"";position:absolute;inset-inline-start:29px;top:58px;bottom:0;width:1px;background:var(--line-light)}
.section--dark .steps li::before,.section--deep .steps li::before{background:var(--line-dark)}
.steps li:last-child::before{display:none}
.steps h3{font-size:1.1rem;margin-top:12px}
.steps p{margin-top:8px;font-size:.94rem}

/* Accordéon FAQ */
.acc{border-top:1px solid var(--line-light)}
.section--dark .acc{border-color:var(--line-dark)}
.acc__item{border-bottom:1px solid var(--line-light)}
.section--dark .acc__item{border-color:var(--line-dark)}
.acc__btn{
  width:100%;background:none;border:0;text-align:start;display:flex;align-items:center;gap:18px;
  padding:22px 4px;font-family:var(--font-display);font-size:clamp(1rem,1.8vw,1.1rem);font-weight:500;line-height:1.4
}
.acc__btn:hover{color:var(--gold-deep)}
.section--dark .acc__btn:hover{color:var(--gold-soft)}
.acc__btn .ico{margin-inline-start:auto;flex:none;color:var(--gold-deep);transition:transform .35s var(--ease)}
.section--dark .acc__btn .ico{color:var(--gold-soft)}
.acc__btn[aria-expanded="true"] .ico{transform:rotate(180deg)}
.acc__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.acc__panel[data-open="true"]{grid-template-rows:1fr}
.acc__panel>div{overflow:hidden}
.acc__panel p{padding:0 4px 24px;max-width:78ch;font-size:.97rem;color:var(--ink-soft)}
.section--dark .acc__panel p{color:var(--on-dark-soft)}

/* Placeholder / note */
.ph{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);border:1px dashed var(--gold);border-radius:var(--r-sm);padding:3px 10px;background:rgba(201,166,107,.08);white-space:normal}
.section--dark .ph,.section--deep .ph{color:var(--gold-soft)}
.note{display:flex;gap:14px;padding:18px 20px;border:1px solid var(--line-light);border-inline-start:2px solid var(--gold);border-radius:var(--r-md);background:rgba(201,166,107,.07);font-size:.92rem;color:var(--ink-soft)}
.note .ico{flex:none;color:var(--gold-deep);width:20px;height:20px;margin-top:3px}
.section--dark .note,.section--deep .note{border-color:var(--line-dark);border-inline-start-color:var(--gold);color:var(--on-dark-soft)}
.section--dark .note .ico,.section--deep .note .ico{color:var(--gold-soft)}

/* ============================================================
   FORMULAIRE
   ============================================================ */
.form{display:grid;gap:18px}
.form__row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.form__row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-family:var(--font-display);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
html[dir="rtl"] .field label{letter-spacing:0}
.section--dark .field label{color:var(--on-dark-soft)}
.field .req{color:var(--gold-deep)}
.field input,.field select,.field textarea{
  font-family:var(--font-body);font-size:1rem;color:var(--ink);background:#fff;
  border:1px solid var(--line-light);border-radius:var(--r-sm);padding:13px 15px;width:100%;
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease);min-height:50px
}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,107,.18)}
.field input[aria-invalid="true"],.field select[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:#B0413E;box-shadow:0 0 0 3px rgba(176,65,62,.14)}
.field__err{font-size:.82rem;color:#B0413E;min-height:0}
.section--dark .field__err{color:#E9A6A4}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;color:var(--ink-soft);line-height:1.55}
.section--dark .check{color:var(--on-dark-soft)}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--gold-deep)}
.check a{border-bottom:1px solid var(--gold);color:var(--petrol-800)}
.section--dark .check a{color:var(--gold-soft)}
.formstate{display:none;gap:16px;align-items:flex-start;padding:26px;border-radius:var(--r-md);border:1px solid var(--line-light)}
.formstate.is-on{display:flex}
.formstate--ok{background:rgba(26,84,76,.07);border-color:rgba(26,84,76,.3)}
.formstate--err{background:rgba(176,65,62,.07);border-color:rgba(176,65,62,.3)}
.formstate .ico{flex:none;width:26px;height:26px;margin-top:2px}
.formstate--ok .ico{color:var(--petrol-600)}
.formstate--err .ico{color:#B0413E}
.spinner{width:17px;height:17px;border:2px solid rgba(6,26,24,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn[aria-busy="true"]{opacity:.75;pointer-events:none}

/* ---- Aperçu du message WhatsApp ---- */
.wapreview{
  margin:0;font-family:var(--font-body);font-size:.92rem;line-height:1.65;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;background:var(--ivory);
  border:1px solid var(--line-light);border-radius:var(--r-md);padding:20px 22px;min-height:190px;
  border-inline-start:3px solid var(--gold)
}
.ministeps{counter-reset:ms;display:grid;gap:16px}
.ministeps li{display:flex;gap:14px;align-items:flex-start}
.ministeps li span{flex:none;width:26px;height:26px;border-radius:var(--r-pill);border:1px solid var(--line-light);
  display:grid;place-items:center;font-family:var(--font-display);font-size:.8rem;color:var(--gold-deep)}
.ministeps li p{font-size:.93rem;color:var(--ink-soft);margin:0}

/* ---- Ligne tarifaire cliquable ---- */
.pricelist li>a{display:flex;align-items:center;gap:clamp(12px,2vw,20px);width:100%;
  padding:15px 12px;border-radius:var(--r-md);transition:background .3s var(--ease)}
.pricelist li>a:hover{background:rgba(201,166,107,.09)}
.pricelist li{padding:0}
.pricelist__go{flex:none;color:var(--gold-deep);opacity:.45;
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.section--dark .pricelist__go,.section--deep .pricelist__go{color:var(--gold-soft)}
.pricelist li>a:hover .pricelist__go,.pricelist li>a:focus-visible .pricelist__go{opacity:1;transform:translateX(3px)}
html[dir="rtl"] .pricelist li>a:hover .pricelist__go{transform:translateX(-3px)}

/* ============================================================
   FOOTER + WHATSAPP
   ============================================================ */
.footer{background:var(--petrol-950);color:var(--on-dark-soft);padding-block:clamp(52px,7vw,84px) 0}
.footer__grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.1fr;gap:clamp(24px,3vw,40px)}
@media (max-width:1040px){.footer__grid{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:680px){.footer__grid{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.footer__grid{grid-template-columns:1fr}}
.footer h4{font-family:var(--font-display);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:20px;font-weight:500}
html[dir="rtl"] .footer h4{letter-spacing:0}
.footer li+li{margin-top:11px}
.footer a{font-size:.93rem;transition:color .25s var(--ease)}
.footer a:hover{color:var(--gold-soft)}
.footer__brand p{font-size:.93rem;margin-top:18px;max-width:38ch}
.footer__bottom{margin-top:clamp(40px,5vw,64px);border-top:1px solid var(--line-dark);padding-block:26px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between;font-size:.83rem}
.footer__bottom p{color:var(--on-dark-soft)}

.wa{
  position:fixed;inset-inline-end:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:11px;
  background:var(--petrol-700);color:var(--ivory);border:1px solid var(--line-dark);
  border-radius:var(--r-pill);padding:12px 20px 12px 16px;box-shadow:var(--shadow-lg);
  font-family:var(--font-display);font-size:.9rem;letter-spacing:.03em;
  transition:background .3s var(--ease),transform .3s var(--ease)
}
.wa:hover{background:var(--petrol-600);transform:translateY(-2px)}
.wa .ico{width:22px;height:22px;color:var(--gold-soft)}
@media (max-width:560px){.wa{padding:14px;inset-inline-end:14px;bottom:14px}.wa span{display:none}.wa .ico{width:24px;height:24px}}

/* ---- 404 ---- */
.err404{min-height:64svh;display:grid;place-items:center;text-align:center;padding-block:clamp(90px,14vw,160px) var(--sec-y);background:var(--petrol-900);color:var(--ivory)}
.err404__code{font-family:var(--font-display);font-size:clamp(4rem,16vw,9rem);font-weight:300;color:var(--gold);line-height:1;letter-spacing:-.04em}

/* ---- Pages légales ---- */
.legal{max-width:78ch}
.legal h2{font-size:1.32rem;margin-top:46px;margin-bottom:14px}
.legal h2:first-of-type{margin-top:0}
.legal p+p{margin-top:12px}
.legal ul{margin-top:12px;display:grid;gap:9px}
.legal ul li{padding-inline-start:20px;position:relative;font-size:.97rem;color:var(--ink-soft)}
.legal ul li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.legal p{color:var(--ink-soft)}

/* ---- Split media ---- */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px);align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.figure{border:1px solid var(--line-dark);border-radius:var(--r-lg);overflow:hidden;background:var(--petrol-800);aspect-ratio:4/3;position:relative}
.section--cream .figure,.section--light .figure{border-color:var(--line-light)}
.figure svg{width:100%;height:100%;display:block}
.figure__cap{position:absolute;inset-inline:14px;bottom:14px;font-size:.74rem;letter-spacing:.06em;color:var(--on-dark-soft);background:rgba(6,26,24,.7);border:1px solid var(--line-dark);border-radius:var(--r-sm);padding:8px 12px;backdrop-filter:blur(4px)}

/* ---- Contact list ---- */
.contactlist li{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-light)}
.section--dark .contactlist li{border-color:var(--line-dark)}
.contactlist li:last-child{border-bottom:0}
.contactlist .ico{flex:none;width:22px;height:22px;color:var(--gold-deep);margin-top:4px}
.section--dark .contactlist .ico{color:var(--gold-soft)}
.contactlist b{display:block;font-family:var(--font-display);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:3px}
html[dir="rtl"] .contactlist b{letter-spacing:0}
.section--dark .contactlist b{color:var(--on-dark-soft)}

/* ---- Réseaux sociaux ---- */
.socials{display:grid;gap:8px;margin-top:4px}
.contactlist .socials li{display:block;padding:0;border:0}
.socials li a,.socials__flat{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line-light);
  border-radius:var(--r-pill);transition:border-color .25s var(--ease),background .25s var(--ease)}
.socials li a:hover{border-color:var(--gold);background:rgba(201,166,107,.09)}
.socials .ico{width:19px;height:19px;color:var(--gold-deep);flex:none}
.socials li a .ico:last-child{margin-inline-start:auto;opacity:.5}
.socials span{display:flex;gap:7px;align-items:baseline;font-size:.92rem;color:var(--ink)}
.socials span b{font-family:var(--font-display);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.socials__flat{opacity:.75}
.section--dark .socials li a,.section--dark .socials__flat{border-color:var(--line-dark)}
.section--dark .socials span{color:var(--on-dark)}

/* ---- Témoignages ---- */
.quote{position:relative;padding-top:14px}
.quote__mark{font-family:var(--font-display);font-size:3rem;line-height:.6;color:var(--gold);opacity:.6}
.quote p{font-size:1rem;font-style:italic;margin-top:14px}
.quote footer{margin-top:18px;font-family:var(--font-display);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.section--dark .quote footer{color:var(--on-dark-soft)}

/* ---- Reveal ---- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important;transition:none!important}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---- Chargement de page ---- */
section[id]{scroll-margin-top:96px}
#view{min-height:60svh}
#view.is-loading{opacity:.4;transition:opacity .2s var(--ease)}
</style>

  faq:{title:"Questions fréquentes", eyebrow:"FAQ",
       lead:"Les réponses ci-dessous reprennent uniquement les informations communiquées par AR SERVICES. Les éléments non encore confirmés sont signalés.",
       items:[
        {q:"Que comprend une offre Omra ?",a:"Selon la formule choisie : vol aller-retour, visa, hébergement à Médine et à Makkah, transferts aéroport ↔ hôtel, transport Makkah ↔ Médine, ziyarat, assistance et accompagnement sur place. Les prestations incluses sont détaillées avant la réservation."},
        {q:"Comment demander un devis ?",a:"Vous ouvrez la page « Commander », choisissez le service et complétez quelques champs. Le site rédige alors votre message et ouvre WhatsApp : il ne vous reste qu’à l’envoyer au "+SITE.phoneDisplay+". Vous pouvez aussi écrire directement sur WhatsApp."},
        {q:"Comment fonctionne la Omra Badal ?",a:"La Omra Badal est une omra réalisée en faveur d’une personne dans l’incapacité permanente de l’accomplir. Vous choisissez le service, vous fournissez les informations demandées, AR SERVICES organise la prestation à Makkah et vous transmet une confirmation. Le tarif indiqué sur les supports est de 180 €."},
        {q:"Quels services par procuration sont disponibles ?",a:"Omra Badal (180 €), sacrifice mouton (180 €), dépôt Coran au Haram (25 €), dépôt chaise au Haram (15 €), ihram pèlerin (20 €), pack de 40 bouteilles d’eau (10 €) et repas offert (5 €)."},
        {q:"Comment fonctionne le service visa ?",a:"AR SERVICES vous accompagne dans la constitution et le suivi de votre demande : visa Omra (300 €) et visa touristique (130 €). L’éligibilité dépend de la nationalité, du passeport et des conditions d’entrée en vigueur. Les documents nécessaires et les frais éventuels vous sont communiqués avant validation. AR SERVICES n’est pas une autorité gouvernementale et ne délivre pas de visa."},
        {q:"Quels sont les moyens de paiement ?",a:"Le paiement s’effectue par virement bancaire. Un acompte est obligatoire pour confirmer toute réservation. Le solde est réglé selon l’échéancier communiqué au client."},
        {q:"Quels documents sont nécessaires ?",a:"Cela dépend du service. Les documents principaux sont le passeport, une photo récente du visage et, pour les femmes, une photo avec le voile. Pour l’Omra Badal, les informations concernant la personne pour laquelle l’Omra est accomplie sont également demandées. Des documents complémentaires peuvent être nécessaires selon le service."},
        {q:"Comment fonctionne la réservation ?",a:"En huit étapes : vous nous contactez avec vos dates, le nombre de voyageurs et vos besoins ; AR SERVICES prépare une proposition adaptée ; vous la validez ; vous transmettez les documents nécessaires ; un acompte confirme la réservation ; AR SERVICES procède aux réservations ; les confirmations et informations de voyage vous sont transmises ; vous bénéficiez d’une assistance avant et pendant le séjour."},
        {q:"Quels sont les délais ?",a:"Réponse sous 24 à 48 heures ouvrées. Les délais de traitement des visas, réservations et démarches administratives varient selon les disponibilités et les organismes concernés : aucun délai fixe ne peut être garanti pour ce qui dépend des autorités."},
        {q:"Puis-je demander un service personnalisé ?",a:"Oui. Décrivez votre besoin dans le formulaire ou sur WhatsApp : AR SERVICES construit la prestation selon votre demande."},
        {q:"Comment contacter AR SERVICES ?",a:"Sur WhatsApp au "+SITE.phoneDisplay+", par le formulaire de devis, ou via les coordonnées de la page Contact."}
       ]},

        {q:"كيف أطلب عرض سعر؟",a:"افتح صفحة «اطلب الآن»، اختر الخدمة واملأ بعض الحقول. عندها يكتب الموقع رسالتكم ويفتح واتساب، ولا يبقى سوى إرسالها إلى "+SITE.phoneDisplay+". ويمكنكم أيضًا المراسلة مباشرة عبر واتساب."},
        {q:"كيف تتم عمرة البدل؟",a:"عمرة البدل تُؤدّى لصالح شخص عاجز عجزًا دائمًا عن أدائها. تختارون الخدمة، وتقدّمون المعلومات المطلوبة، وتنظّم AR SERVICES التنفيذ في مكة ثم يصلكم تأكيد. السعر المعلن على الدعامات هو 180 €."},
        {q:"ما هي الخدمات بالوكالة المتاحة؟",a:"عمرة البدل (180 €)، ذبح أضحية (180 €)، وقف مصحف في الحرم (25 €)، وقف كرسي في الحرم (15 €)، إحرام للحاج (20 €)، باقة 40 قارورة ماء (10 €)، والتصدق بوجبة (5 €)."},
        {q:"كيف تعمل خدمة التأشيرة؟",a:"ترافقكم AR SERVICES في تجهيز الملف ومتابعته: تأشيرة العمرة (300 €) والتأشيرة السياحية (130 €). تعتمد الأهلية على الجنسية وجواز السفر وشروط الدخول السارية، وتُبلَّغ الوثائق والرسوم قبل الاعتماد. AR SERVICES ليست جهة حكومية ولا تُصدر التأشيرات."},
        {q:"ما هي وسائل الدفع؟",a:"يتم الدفع عبر التحويل البنكي. ويُشترط دفع عربون لتأكيد أي حجز، ثم يُسدَّد الباقي وفق الجدول المبلَّغ للعميل."},
        {q:"ما هي الوثائق المطلوبة؟",a:"يتوقف ذلك على الخدمة. الوثائق الأساسية: جواز السفر، صورة حديثة للوجه، وللنساء صورة بالحجاب. وفي عمرة البدل تُطلب أيضًا معلومات الشخص الذي تُؤدّى العمرة عنه. وقد تلزم وثائق إضافية حسب الخدمة."},
        {q:"كيف يتم الحجز؟",a:"في ثماني خطوات: تتواصلون معنا بالتواريخ وعدد المسافرين واحتياجاتكم؛ تُعِدّ AR SERVICES عرضًا مناسبًا؛ توافقون عليه؛ ترسلون الوثائق المطلوبة؛ يؤكد العربون الحجز؛ تُنجز AR SERVICES الحجوزات؛ تصلكم التأكيدات ومعلومات الرحلة؛ ثم ترافقكم المساعدة قبل الرحلة وأثناءها."},
        {q:"ما هي المدد؟",a:"الرد خلال 24 إلى 48 ساعة عمل. أما مدد معالجة التأشيرات والحجوزات والإجراءات الإدارية فتختلف حسب التوفر والجهات المعنية، ولا يمكن ضمان مدة ثابتة لما يعود إلى السلطات."},
        {q:"هل يمكن طلب خدمة مخصصة؟",a:"نعم. صِف حاجتك في النموذج أو على واتساب، وتبني AR SERVICES الخدمة وفق طلبك."},

       ]},

       lead:"The answers below only use information provided by AR SERVICES. Anything not yet confirmed is flagged as such.",
       items:[
        {q:"What does an Umrah offer include?",a:"Depending on the package: return flight, visa, accommodation in Madinah and Makkah, airport ↔ hotel transfers, Makkah ↔ Madinah transport, ziyarat, and on-site assistance. Everything included is set out in detail before you book."},
        {q:"How do I place an order?",a:"Open the \u201cOrder now\u201d page, choose your service and fill in a few fields. The site then writes your message and opens WhatsApp: all that is left is to send it to "+SITE.phoneDisplay+". You can also message us directly on WhatsApp."},
        {q:"How does Omra Badal work?",a:"Omra Badal is an Umrah performed on behalf of someone permanently unable to perform it. You choose the service, provide the details requested, AR SERVICES carries it out in Makkah and sends you a confirmation. The price stated is 180 \u20ac."},
        {q:"Which services by proxy are available?",a:"Omra Badal (180 \u20ac), sheep sacrifice (180 \u20ac), Quran placed at the Haram (25 \u20ac), chair placed at the Haram (15 \u20ac), ihram for a pilgrim (20 \u20ac), a pack of 40 water bottles (10 \u20ac) and a meal offered (5 \u20ac)."},
        {q:"How does the visa service work?",a:"AR SERVICES helps you prepare and follow up your application: Umrah visa (300 \u20ac) and tourist visa (130 \u20ac). Eligibility depends on your nationality, your passport and the entry rules in force. The documents needed and any fees are given to you before validation. AR SERVICES is not a government body and does not issue visas."},
        {q:"What payment methods are accepted?",a:"Payment is made by bank transfer. A deposit is required to confirm any booking. The balance is then paid according to the schedule given to you."},
        {q:"What documents are needed?",a:"It depends on the service. The main documents are your passport, a recent photo of your face and, for women, a photo with the veil. For Omra Badal, the details of the person the Umrah is performed for are also requested. Further documents may be needed depending on the service."},
        {q:"How does booking work?",a:"In eight steps: you contact us with your dates, the number of travellers and your needs; AR SERVICES prepares a suitable proposal; you approve it; you send the required documents; a deposit confirms the booking; AR SERVICES makes the bookings; your confirmations and travel details are sent to you; you are supported before and during your stay."},
        {q:"How long does it take?",a:"A reply within 24 to 48 working hours. Processing times for visas, bookings and administrative steps vary with availability and with the bodies involved: no fixed timescale can be guaranteed for anything that depends on the authorities."},
        {q:"Can I request a custom service?",a:"Yes. Describe what you need in the form or on WhatsApp: AR SERVICES will build the service around your request."},
        {q:"How do I contact AR SERVICES?",a:"On WhatsApp at "+SITE.phoneDisplay+", through the order form, or using the details on the Contact page."}

function t(path){
  var parts = path.split("."), o = T[LANG], i;
  for(i=0;i<parts.length;i++){
    if(!own(o,parts[i])) return "";                        // jamais de remontée vers le prototype
    o = o[parts[i]];
  }
  return o==null ? "" : o;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
var ICONS = ["i-kaaba","i-sheep","i-quran","i-chair","i-ihram","i-water","i-meal","i-passport",
  "i-plane","i-bus","i-hotel","i-support","i-whatsapp","i-phone","i-mail","i-pin","i-clock",
  "i-check","i-alert","i-info","i-arrow","i-chevron","i-menu","i-close","i-shield","i-doc",
  "i-users","i-globe","i-box","i-star","i-instagram","i-tiktok","i-snapchat"];
function ic(id,cls){
  if(ICONS.indexOf(id) === -1) return "";                 // liste blanche : rien d'autre n'est rendu
  var c = "ico "+(cls||"")+(id==="i-arrow"?" ico--dir":"");
  return '<svg class="'+esc(c.trim())+'" aria-hidden="true" focusable="false"><use href="#'+id+'"></use></svg>';
}
/* Liens issus de la configuration : seuls les schémas sûrs sont acceptés.
   Empêche un javascript: ou data: collé par erreur dans SITE.socials. */
function safeUrl(u){
  u = String(u||"").trim();
  return /^(https?:|mailto:|tel:)/i.test(u) ? u : "#";
}
function money(p){
  if(p===null||p===undefined) return null;
  return LANG==="ar" ? (p+" "+SITE.currency) : (p+" "+SITE.currency);
}
function priceTag(p,opts){
  opts = opts||{};
  if(p===null||p===undefined){
    return '<span class="price price--quote">'+esc(t("common.quoteOnly"))+'</span>';
  }
  return '<span class="price">'+(opts.from?'<small>'+esc(t("common.from"))+'</small>':'')+'<bdi dir="ltr">'+esc(money(p))+'</bdi></span>';
}

function waLink(kind,extra){
  var msg = (WA_MSG[LANG]||WA_MSG.fr)[kind] || (WA_MSG[LANG]||WA_MSG.fr).general;
  if(extra) msg += " " + extra;
  return "https://wa.me/"+SITE.waNumber+"?text="+encodeURIComponent(msg);
}
function waKindFor(id){
  if(id==="omra-badal") return "badal";
  if(id==="visa-omra"||id==="visa-tourisme") return "visa";
  if(id==="omra-sur-mesure") return "omra";
  return "procuration";
}
function nm(o){ return o[LANG] || o.fr; }
/* Met en évidence tout marqueur [À FOURNIR] / [بانتظار …] présent dans un texte */
function ph(v){
  return esc(v).replace(/\[[^\]]+\]/g, function(m){ return '<span class="ph">'+m+'</span>'; });
}

function sectionHead(eyebrow,title,lead,center){
  return '<div class="'+(center?"":"")+'" style="max-width:'+(center?"760px;margin-inline:auto;text-align:center":"820px")+'">'+

    '<h2 class="h-lg">'+esc(title)+'</h2>'+
    (lead?'<p class="lead" style="margin-top:18px'+(center?';margin-inline:auto':'')+'">'+esc(lead)+'</p>':'')+
  '</div>';
}
function crumbs(current){
  return '<nav class="crumbs" aria-label="Fil d’ariane"><a href="#/">'+esc(t("common.breadcrumbHome"))+'</a><span>/</span><span aria-current="page">'+esc(current)+'</span></nav>';

function pageHead(eyebrow,title,lead){
  return '<section class="pagehead"><div class="wrap pagehead__inner">'+crumbs(title)+

function serviceCard(item,opts){
  opts = opts||{};

    '<h3>'+esc(nm(item.name))+'</h3>'+
    '<p>'+esc(nm(item.desc))+'</p>'+
    (item.includes?'<ul style="display:grid;gap:8px;margin-top:2px">'+nm(item.includes).map(function(x){

    '<div class="card__foot">'+priceTag(item.price,{from:item.price!==null&&opts.from})+
    '<a class="btn btn--outline btn--sm" href="#/offre?id='+encodeURIComponent(item.id)+'">'+esc(t("cta.seeOffer"))+'</a></div>'+
    '<a class="linkarrow" style="font-size:.86rem" href="'+waLink(kind)+'" target="_blank" rel="noopener noreferrer">'+esc(t("cta.whatsapp"))+ic("i-arrow")+'</a>'+

  return '<li><a href="#/offre?id='+encodeURIComponent(item.id)+'" aria-label="'+esc(nm(item.name))+' — '+esc(t("cta.seeOffer"))+'">'+

function stepsList(steps){
  return '<ol class="steps">'+steps.map(function(s,i){
    return '<li class="reveal"><span class="steps__num">'+("0"+(i+1))+'</span><div><h3>'+esc(s.t)+'</h3><p class="muted">'+ph(s.d)+'</p></div></li>';
  }).join("")+'</ol>';
}
function accordion(items,idPrefix){
  return '<div class="acc">'+items.map(function(it,i){
    var id = idPrefix+"-"+i;
    return '<div class="acc__item">'+
      '<h3 style="margin:0"><button class="acc__btn" type="button" aria-expanded="false" aria-controls="'+id+'">'+esc(it.q)+ic("i-chevron")+'</button></h3>'+

/* ---------------------------------------------------------------
   8. SEO — métadonnées dynamiques + données structurées
   --------------------------------------------------------------- */
var BASE = "https://www.ar-services.example/";
function setMeta(sel,attr,val){ var el=document.querySelector(sel); if(el) el.setAttribute(attr,val); }
function updateMeta(path,route){
  var m = route && route.meta ? route.meta[LANG] : null;
  var title, desc;
  if(m){ title = m.t; desc = m.d; }
  else{
    var map = {"/mentions-legales":"notice","/confidentialite":"privacy","/cgv":"terms","/paiement":"payment","/annulation":"refund","/reclamation":"claims","/cookies":"cookies"};
    if(map[path]){ var d = t("legal."+map[path]); title = d.title+" — AR SERVICES"; desc = d.intro; }
    else{ title = t("e404.title")+" — AR SERVICES"; desc = t("e404.text"); }
  }
  document.title = title;
  setMeta('meta[name="description"]',"content",desc);
  setMeta('meta[property="og:title"]',"content",title);
  setMeta('meta[property="og:description"]',"content",desc);
  setMeta('meta[name="twitter:title"]',"content",title);
  setMeta('meta[name="twitter:description"]',"content",desc);
  /* Une URL inconnue est contrôlée par un tiers : on ne la recopie jamais
     dans les métadonnées, on renvoie vers la page d'accueil. */
  var known = own(ROUTES, path) ? path : "/";
  setMeta('meta[property="og:url"]',"content",BASE+(known==="/"?"":"#"+known));
  setMeta('link[rel="canonical"]',"href",BASE+(known==="/"?"":"#"+known));
  setMeta('meta[property="og:locale"]',"content",LANG==="ar"?"ar_SA":(LANG==="en"?"en_GB":"fr_FR"));
  setMeta('meta[name="robots"]',"content", own(ROUTES,path)?"index,follow":"noindex,follow");
}
function injectJsonLd(path){
  var old = document.getElementById("ld-json"); if(old) old.remove();
  if(!own(ROUTES,path)) return;                 // pas de données structurées sur une page inconnue
  var org = {
    "@context":"https://schema.org","@type":"Organization","name":"AR SERVICES",
    "url":BASE,"description":t("footer.desc"),
    "telephone":SITE.phoneRaw,"email":SITE.email,"foundingDate":"2026",
    "address":{"@type":"PostalAddress","addressLocality":"Madinah","addressCountry":"SA"},
    "areaServed":["Makkah","Madinah"],
    "sameAs":SITE.socials.filter(function(x){ return !!x.url; }).map(function(x){ return x.url; }),
    "contactPoint":[{"@type":"ContactPoint","telephone":SITE.phoneRaw,"email":SITE.email,
                     "contactType":"customer service","availableLanguage":["fr","en","ar"]}]
  };
  var graph = [org];
  if(path==="/faq"){
    graph.push({"@context":"https://schema.org","@type":"FAQPage","mainEntity":t("faq.items").map(function(x){
      return {"@type":"Question","name":x.q,"acceptedAnswer":{"@type":"Answer","text":x.a}};})});
  }
  if(path==="/offres"||path==="/"){
    graph.push({"@context":"https://schema.org","@type":"ItemList","itemListElement":
      CATALOG.procuration.concat(CATALOG.visa).map(function(o,i){
        return {"@type":"ListItem","position":i+1,"item":{"@type":"Service","name":nm(o.name),"description":nm(o.desc),
          "provider":{"@type":"Organization","name":"AR SERVICES"},
          "offers":{"@type":"Offer","price":o.price,"priceCurrency":"EUR"}}};})});
  }
  var s = document.createElement("script");
  s.type="application/ld+json"; s.id="ld-json";
  s.textContent = JSON.stringify(graph.length===1?graph[0]:graph);
  document.head.appendChild(s);
}

/* ---------------------------------------------------------------
   9. INTERACTIONS
   --------------------------------------------------------------- */
function bindAccordions(root){
  root.querySelectorAll(".acc__btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      var open = btn.getAttribute("aria-expanded")==="true";
      var panel = document.getElementById(btn.getAttribute("aria-controls"));
      btn.setAttribute("aria-expanded", open?"false":"true");
      if(panel) panel.setAttribute("data-open", open?"false":"true");
    });
  });
}
var io = null;
function bindReveal(root){
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    root.querySelectorAll(".reveal").forEach(function(el){el.classList.add("is-in");}); return;
  }
  if(io) io.disconnect();
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("is-in"); io.unobserve(e.target); } });
  },{rootMargin:"0px 0px -8% 0px",threshold:.08});
  root.querySelectorAll(".reveal").forEach(function(el,i){ el.style.transitionDelay=(Math.min(i,6)*55)+"ms"; io.observe(el); });
}
function bindWa(root){
  root.querySelectorAll("[data-wa]").forEach(function(a){
    a.setAttribute("href", waLink(a.getAttribute("data-wa")));
    a.setAttribute("target","_blank"); a.setAttribute("rel","noopener noreferrer");
  });
}

/* --- Commande : le formulaire compose le message WhatsApp --- */
var RX = { email:/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i };
function showErr(name,msg){
  var input = document.getElementById("q-"+name), err = document.getElementById("e-"+name);
  if(err) err.textContent = msg||"";
  if(input) input.setAttribute("aria-invalid", msg?"true":"false");
}
function readOrder(form){
  /* accès par sélecteur : l'accès nommé sur un formulaire peut être masqué
     par les propriétés natives (name, method, action…) */
  var val = function(n){
    var el = form.querySelector('[name="'+n+'"]');
    return el ? String(el.value).trim() : "";
  };
  return {
    service: val("service"), first: val("first"), last: val("last"),
    people:  val("people"),  date:  val("date"),  email: val("email"),
    message: val("message"), website: val("website")
  };
}
function serviceLabel(id){
  var all = CATALOG.omra.concat(CATALOG.procuration, CATALOG.visa), i;
  for(i=0;i<all.length;i++){
    if(all[i].id===id) return nm(all[i].name)+(all[i].price!==null?" — "+money(all[i].price):"");
  }
  return id==="autre" ? t("quote.f.other") : "";
}
function fmtDate(v){
  if(!v) return "";
  var p = v.split("-");
  return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0]) : v;
}
function buildOrderMessage(d){
  var M = t("quote.msg"), L = [M.intro, ""], SEP = (LANG==="fr" ? " : " : ": ");
  L.push(M.want+" "+(serviceLabel(d.service) || "…"));
  var name = (d.first+" "+d.last).trim();
  if(name)      L.push(M.name+SEP+name);
  if(d.people)  L.push(M.people+SEP+d.people);
  if(d.date)    L.push(M.date+SEP+fmtDate(d.date));
  if(d.email)   L.push(M.email+SEP+d.email);
  if(d.message){ L.push(""); L.push(M.details+SEP+d.message); }
  L.push(""); L.push(M.from);
  return L.join("\n");
}
function orderLink(d){ return "https://wa.me/"+SITE.waNumber+"?text="+encodeURIComponent(buildOrderMessage(d)); }

function bindForm(){
  var form = document.getElementById("quoteform"); if(!form) return;
  var preview = document.getElementById("wa-preview");
  var okBox = document.getElementById("form-ok");
  var btn   = document.getElementById("q-submit");
  var E = t("quote.errors");

  function refresh(){
    var d = readOrder(form);
    if(preview) preview.textContent = buildOrderMessage(d);
    btn.setAttribute("href", orderLink(d));      // le lien est toujours à jour
    return d;
  }
  refresh();
  form.querySelectorAll("input,select,textarea").forEach(function(el){
    el.addEventListener("input",function(){
      refresh();
      if(el.name && el.value.trim()) showErr(el.name,"");
    });
    el.addEventListener("change",refresh);
  });

  function validate(d){
    var bad = null;
    if(!d.service){ showErr("service", E.service); bad = "service"; } else showErr("service","");
    ["first","last"].forEach(function(k){
      if(!d[k]){ showErr(k, E.required); bad = bad || k; } else showErr(k,"");
    });
    if(d.email && !RX.email.test(d.email)){ showErr("email", E.email); bad = bad || "email"; }
    if(d.website) bad = bad || "website";        // pot de miel
    return bad;
  }

  /* Clic sur le bouton : si le formulaire est valide, le navigateur suit le lien
     WhatsApp normalement — aucune fenêtre ouverte par script, donc rien à bloquer. */
  btn.addEventListener("click", function(ev){
    var d = refresh(), bad = validate(d);
    if(bad){
      ev.preventDefault();
      var el = document.getElementById("q-"+bad);
      if(el){ el.focus(); el.scrollIntoView({behavior:"smooth",block:"center"}); }
      return;
    }
    var again = document.getElementById("wa-again");
    if(again) again.setAttribute("href", orderLink(d));
    okBox.classList.add("is-on");
    setTimeout(function(){
      okBox.scrollIntoView({behavior:"smooth",block:"center"});
      try{ okBox.focus({preventScroll:true}); }catch(e){}
    }, 250);
  });

  /* Touche Entrée dans un champ : même comportement que le bouton */
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    btn.click();
  });

  var copy = document.getElementById("wa-copy");
  if(copy){
    copy.addEventListener("click", function(){
      var txt = buildOrderMessage(readOrder(form));
      var done = function(){
        copy.textContent = t("quote.copied");
        setTimeout(function(){ copy.textContent = t("quote.copy"); }, 2200);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, done);
      }else{
        var ta = document.createElement("textarea");
        ta.value = txt; ta.setAttribute("readonly","");
        ta.style.cssText = "position:fixed;left:-9999px";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); }catch(e){}
        document.body.removeChild(ta); done();
      }
    });
  }
}

/* ---------------------------------------------------------------
   10. ROUTEUR
   --------------------------------------------------------------- */
/* Route courante. Dans certains contextes embarqués (iframe srcdoc), l'API History
   et l'URL sont inaccessibles : on garde alors la route en mémoire. */
var ROUTE_OVERRIDE = null;
function currentHash(){
  if(ROUTE_OVERRIDE !== null) return ROUTE_OVERRIDE;
  try{ return location.hash; }catch(e){ return ""; }
}
function navigate(href){
  ROUTE_OVERRIDE = href;
  try{
    if(window.history && history.pushState){
      history.pushState(null,"",href);
      ROUTE_OVERRIDE = null;              // l'URL fait foi si elle a pu être mise à jour
    }else{
      location.hash = href;
      ROUTE_OVERRIDE = null;
    }
  }catch(e){ /* URL non modifiable : la route reste en mémoire */ }
  render();
}
var QUERY_KEYS = ["service","id"];              // seuls paramètres acceptés
function parseHash(){
  var h = currentHash().replace(/^#/,"") || "/";
  var qi = h.indexOf("?"), q = Object.create(null), path = h;   // pas de prototype : pas de pollution
  if(qi>-1){
    path = h.slice(0,qi);
    h.slice(qi+1).split("&").slice(0,10).forEach(function(kv){
      var p = kv.split("="), k, v;
      try{ k = decodeURIComponent(p[0]||""); v = decodeURIComponent(p[1]||""); }catch(e){ return; }
      if(QUERY_KEYS.indexOf(k) === -1) return;                  // liste blanche des clés
      if(!/^[A-Za-z0-9_-]{1,40}$/.test(v)) return;              // liste blanche des valeurs
      q[k] = v;
    });
  }
  var anchor = "";
  var hi = path.indexOf("#");
  if(hi>0){ anchor = path.slice(hi+1); path = path.slice(0,hi); }
  if(!/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test(anchor)) anchor = "";   // liste blanche
  if(path.length>1) path = path.replace(/\/+$/,"");
  if(!path) path = "/";
  return {path:path, query:q, anchor:anchor};
}
/* Défilement doux vers une section de la page, sous l'en-tête fixe */
function scrollToAnchor(id, smooth){
  var el = id ? document.getElementById(id) : null;
  if(!el) return false;
  var reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:(smooth && !reduit) ? "smooth" : "auto", block:"start"});
  return true;
}
var firstRender = true;
function render(){
  var r = parseHash();
  var route = own(ROUTES, r.path) ? ROUTES[r.path] : null;      // "/constructor" & co. → 404
  var view = document.getElementById("view");
  var fn = route ? route.view : P.notfound;
  view.innerHTML = fn(r.query);
  renderNav(r.path);
  renderFooter();
  updateMeta(r.path, route);
  injectJsonLd(r.path);
  bindAccordions(view); bindReveal(view); bindWa(document); bindForm();
  closeMenu();
  if(!firstRender){
    window.scrollTo({top:0,behavior:"auto"});
    document.getElementById("main").focus({preventScroll:true});
  }
  firstRender = false;
  if(r.anchor){ setTimeout(function(){ scrollToAnchor(r.anchor, true); }, 60); }
}

/* ---------------------------------------------------------------
   11. LANGUE, MENU, HEADER
   --------------------------------------------------------------- */
function applyLang(){
  var cfg = T[LANG];
  document.documentElement.lang = cfg.htmlLang;
  document.documentElement.dir = cfg.dir;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll(".langsw button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===LANG ? "true":"false");
  });
  var burger = document.getElementById("burger");
  if(burger) burger.setAttribute("aria-label", LANG==="ar"?"فتح القائمة":"Ouvrir le menu");
}
function setLang(l){
  if(l===LANG) return;
  LANG = l;
  try{ localStorage.setItem(STORE_KEY,l); }catch(e){}
  applyLang(); render();
}
document.querySelectorAll(".langsw button").forEach(function(b){
  b.addEventListener("click",function(){ setLang(b.getAttribute("data-lang")); });
});

var menu = document.getElementById("mobilemenu"), burger = document.getElementById("burger");
function openMenu(){
  menu.hidden=false;
  requestAnimationFrame(function(){ menu.classList.add("is-open"); });
  burger.setAttribute("aria-expanded","true");
  document.body.style.overflow="hidden";
  var first = menu.querySelector("a"); if(first) first.focus();
}
function closeMenu(){
  if(!menu.classList.contains("is-open")){ menu.hidden = true; return; }
  menu.classList.remove("is-open");
  burger.setAttribute("aria-expanded","false");
  document.body.style.overflow="";
  setTimeout(function(){ if(!menu.classList.contains("is-open")) menu.hidden=true; },450);
}
burger.addEventListener("click",function(){
  burger.getAttribute("aria-expanded")==="true" ? closeMenu() : openMenu();
});
document.getElementById("closemenu").addEventListener("click",closeMenu);
menu.addEventListener("click",function(e){ if(e.target.closest("a")) closeMenu(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeMenu(); });

var header = document.getElementById("header"), lastY=0, ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    var y = window.scrollY||window.pageYOffset;
    header.classList.toggle("is-stuck", y>28);
    lastY=y; ticking=false;
  });
}
window.addEventListener("scroll",onScroll,{passive:true});

/* --- Navigation interne : on gère nous-mêmes les liens en #/…
   Aucune navigation réelle n'est déclenchée : pas d'ouverture d'onglet,
   pas de confirmation de sortie de page dans les environnements embarqués. --- */
document.addEventListener("click", function(e){
  if(e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
  if(!a) return;
  var href = a.getAttribute("href");
  if(!href || href.charAt(0) !== "#") return;   // liens externes (WhatsApp, tel:) inchangés
  e.preventDefault();
  e.stopPropagation();
  closeMenu();
  if(href === "#" ){ return; }
  /* ancre dans la page courante : #section */
  if(href.charAt(1) !== "/" && href !== "#main"){
    scrollToAnchor(href.slice(1), true);
    return;
  }
  /* route + ancre : #/services#procuration — si on y est déjà, on défile seulement */
  var hi = href.indexOf("#", 1);
  if(hi > 0){
    var cible = href.slice(0, hi), frag = href.slice(hi + 1);
    if(parseHash().path === cible.slice(1)){ scrollToAnchor(frag, true); return; }
  }
  if(href === "#main"){
    var m = document.getElementById("main");
    if(m){ m.focus({preventScroll:true}); m.scrollIntoView({behavior:"smooth",block:"start"}); }
    return;
  }
  navigate(href);
}, true);
function onUrlChange(){ ROUTE_OVERRIDE = null; render(); }
window.addEventListener("popstate",onUrlChange);
window.addEventListener("hashchange",onUrlChange);
applyLang();
render();
onScroll();
})();
</script>
